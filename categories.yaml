# 6. Fallback for Discover-assigned categories that are trustworthy enough to
#    map 1:1 when no merchant rule fired. Merchandise / Services / Department
#    Stores are deliberately ABSENT: too coarse, per-merchant rules only
#    (per sources.md), so their unmatched remainder lands in Uncategorized.
discover_fallback:
  Restaurants: Food
  Supermarkets: Food
  Gasoline: Transportation
  Education: Education
  'Travel/ Entertainment': Entertainment
  'Medical Services': Healthcare
