# categories.yaml — rule set for merchant canonicalisation + BLS categorisation.
# Consumed by normalize.py (shared by clean.py and categorize.py).
# Edit rules here; no code changes needed.
#
# WHAT LIVES WHERE
#   categories.yaml            (tracked)   schema, category lists, generic
#                                          bank-plumbing patterns, and a few
#                                          example merchant rules.
#   categories.local.yaml      (gitignored) the real personal rule set —
#                                          merchants, employers, counterparties,
#                                          hand-tagged rows, home geography.
#   sample/categories.sample.yaml          the synthetic demo rule set, loaded
#                                          instead of the local one when
#                                          SPEND_CATEGORIES_LOCAL points at it.
# normalize.Resolver merges an overlay by APPENDING its list sections after the
# tracked ones, so tracked rules always match first and the merged order is
# stable. Without any overlay the pipeline still runs end to end; rows that
# only a personal rule would have matched fall through to Uncategorized
# (or to the peer/Discover fallbacks) rather than crashing.
#
# Matching precedence (implemented in normalize.py):
#   1. transfer_patterns        -> Transfer  (excluded from spend)
#   2. income_patterns          -> Income    (excluded from spend)
#   3. transaction_overrides    -> hand-tagged category for an exact (date, amount)
#   4. peer detection           -> peer override rules, else Miscellaneous default
#   5. merchants (ordered list) -> canonical merchant + BLS category
#   6. discover_fallback        -> Discover's own category, coarse-mapped
#   7. otherwise                -> Uncategorized
#
# All `match` values are case-insensitive regexes searched against the raw
# description AFTER junk removal (processor IDs, FX tails, redaction tokens,
# trailing MM/DD dates) but BEFORE city/state stripping.

bls_categories:
  - Food
  - Alcoholic beverages
  - Housing
  - Apparel and services
  - Transportation
  - Healthcare
  - Entertainment
  - Personal care products and services
  - Reading
  - Education
  - Tobacco products and smoking supplies
  - Miscellaneous
  - Cash contributions
  - Personal insurance and pensions

admin_categories:
  - Transfer        # movements between my own accounts / card payments — excluded
  - Income          # payroll, FAFSA disbursements, marketplace payouts — excluded
  - Uncategorized   # unmatched or deliberately-unknowable (cash) — reported

# ---------------------------------------------------------------------------
# 1. Transfers: NOT spending; would double-count card purchases or are pure
#    account plumbing. Kept in output for reconciliation, excluded from totals.
#    These are bank-generated strings, not merchant identities.
transfer_patterns:
  - 'INTERNET PAYMENT - THANK YOU'      # card payment from checking
  - 'RETURNED INTERNET PMT'             # ...and its bounce reversal
  - '^ONLINE TRANSFER (TO|FROM) CHK'    # between my own accounts
  - '^DISCOVER\s+E-PAYMENT'             # paying the card from checking
  - 'ACCTVERIFY'                        # payroll-provider penny verification
  - 'PENNY TEST'                        # landlord portal penny test
  - '^ATM CASH DEPOSIT'                 # cash entering the account, not income
  - 'STMT CRDT REDEMPTION'              # card cashback redeemed as credit
  - '^CASHBACK BONUS REDEMPTION'

# 2. Income: money earned/received, not consumption. Excluded from spend.
#    Employer, university and marketplace names identify me, so those patterns
#    live in the overlay; only the generic payroll match is tracked.
income_patterns:
  - 'PAYROLL'                           # any employer's payroll ACH credit

# 3. Transaction overrides: hand-tags for single rows whose description can
#    never reveal the category (e.g. rent paid peer-to-peer). `date` is the
#    normalised YYYY-MM-DD transaction date; `amount` is matched on absolute
#    value, so it works regardless of source sign convention. A matching row
#    takes the given category directly, skipping peer default_category and
#    merchant rules; peer rows keep their merchant/counterparty and still
#    appear in zelle_review.csv.
#    Every real entry is a personal transaction detail, so they live in the
#    overlay; categorize.py asserts each one matches exactly one row.
transaction_overrides: []

# 4. Peer payments (Zelle / QuickPay / Venmo / Apple Cash / Wise).
#    These ARE spending (reimbursements for real consumption). Direction from
#    the source Type + sign; every peer row is also written to zelle_review.csv.
peer:
  chase_types_outgoing: [QUICKPAY_DEBIT, CHASE_TO_PARTNERFI]
  chase_types_incoming: [QUICKPAY_CREDIT, PARTNERFI_TO_CHASE]
  description_patterns:                 # card/ACH rails that are really P2P
    - '^VENMO\b'
    - '^WISE US INC'
    - '^APPLE CASH'
  default_category: Miscellaneous       # description almost never says what was bought
  overrides: []                         # named counterparties -> overlay

# Location tokens (not part of the matching precedence): trailing place names
#    stripped from the generic merchant
#    fallback (rule-matched merchants never reach it). Only two-letter state
#    codes are tracked — the city, ward and country tokens in my own data say
#    where I live and travel, so they live in the overlay. Missing tokens are
#    cosmetic only: an unmatched merchant keeps its trailing place name.
location_tokens:
  - CA
  - CO
  - DE
  - FL
  - GA
  - IL
  - KS
  - MD
  - MN
  - NJ
  - NV
  - NY
  - OH
  - PA
  - TN
  - TX
  - WA

# 5. Merchant rules. First match wins. `merchant` is the canonical name used
#    for dedupe and the collapse report; `category` must be a BLS category,
#    or Uncategorized for identifiable-but-unknowable merchants.
#    The real rule set is in the overlay. What stays here is the fee/cash block
#    (bank-generated strings that name no business) plus clearly fictional
#    examples showing the three shapes a rule takes: a plain substring, an
#    alternation across spellings, and a deliberate Uncategorized tag.
merchants:
  # --- fees / cash ---
  - {match: 'FOREIGN EXCHANGE RATE ADJUSTMENT FEE', merchant: CHASE FX FEE, category: Miscellaneous}
  - {match: 'NON-CHASE ATM FEE', merchant: ATM FEE, category: Miscellaneous}
  - {match: '(^|NON-CHASE )ATM WITHDRAW', merchant: ATM WITHDRAWAL, category: Uncategorized}  # cash spend, unattributable

  # --- illustrative examples (fictional; they match no real description) ---
  - {match: 'EXAMPLE GROCERY CO', merchant: EXAMPLE GROCERY, category: Food}
  - {match: 'EXAMPLE COFFEE|EXAMPLECOFFEE|SQ \*EXAMPLE COFFEE', merchant: EXAMPLE COFFEE, category: Food}
  - {match: 'EXAMPLE TRANSIT AUTH', merchant: EXAMPLE TRANSIT, category: Transportation}
  # identifiable merchant, unknowable goods -> counted as spend, not guessed
  - {match: 'EXAMPLE MARKETPLACE', merchant: EXAMPLE MARKETPLACE, category: Uncategorized}

# 6. Fallback for card-assigned categories that are trustworthy enough to
#    map 1:1 when no merchant rule fired. Merchandise / Services / Department
#    Stores are deliberately ABSENT: too coarse, per-merchant rules only
#    (per sources.md), so their unmatched remainder lands in Uncategorized.
discover_fallback:
  Restaurants: Food
  Supermarkets: Food
  Gasoline: Transportation
  Education: Education
  'Travel/ Entertainment': Entertainment
  'Medical Services': Healthcare
