# categories.yaml — rule set for merchant canonicalisation + BLS categorisation.
# Consumed by normalize.py (shared by clean.py and categorize.py).
# Edit rules here; no code changes needed.
#
# Matching precedence (implemented in normalize.py):
#   1. transfer_patterns        -> Transfer  (excluded from spend)
#   2. income_patterns          -> Income    (excluded from spend)
#   3. transaction_overrides    -> hand-tagged category for an exact (date, amount)
#   4. peer detection           -> peer override rules, else Miscellaneous default
#   5. merchants (ordered list) -> canonical merchant + BLS category
#   6. discover_fallback        -> Discover's own category, coarse-mapped
#   7. otherwise                -> Uncategorized
#
# All `match` values are case-insensitive regexes searched against the raw
# description AFTER junk removal (processor IDs, FX tails, redaction tokens,
# trailing MM/DD dates) but BEFORE city/state stripping.

bls_categories:
  - Food
  - Alcoholic beverages
  - Housing
  - Apparel and services
  - Transportation
  - Healthcare
  - Entertainment
  - Personal care products and services
  - Reading
  - Education
  - Tobacco products and smoking supplies
  - Miscellaneous
  - Cash contributions
  - Personal insurance and pensions

admin_categories:
  - Transfer        # movements between my own accounts / card payments — excluded
  - Income          # payroll, FAFSA disbursements, marketplace payouts — excluded
  - Uncategorized   # unmatched or deliberately-unknowable (cash) — reported

# ---------------------------------------------------------------------------
# 1. Transfers: NOT spending; would double-count card purchases or are pure
#    account plumbing. Kept in output for reconciliation, excluded from totals.
transfer_patterns:
  - 'INTERNET PAYMENT - THANK YOU'      # Discover card payment from checking
  - 'RETURNED INTERNET PMT'             # ...and its bounce reversal
  - '^ONLINE TRANSFER (TO|FROM) CHK'    # between my own Chase accounts
  - '^DISCOVER\s+E-PAYMENT'             # paying the Discover card from Chase
  - 'ACCTVERIFY'                        # Gusto/payroll penny verifications
  - 'PENNY TEST'                        # Yardi penny test
  - '^ATM CASH DEPOSIT'                 # cash entering the account, not income
  - 'STMT CRDT REDEMPTION'              # Discover cashback redeemed as credit
  - '^CASHBACK BONUS REDEMPTION'

# 2. Income: money earned/received, not consumption. Excluded from spend.
income_patterns:
  - 'PAYROLL'                           # Naya Dessert Cafe, Target Corporate
  - 'CHIPGRIL\s+PAYMENTS'               # ChipGril pay (PPD credits)
  - 'HANDSHAKE'                         # Handshake AI gig payouts (Stripe)
  - '^UNIVERSITY OF C\s+STUDENT FE'     # FAFSA/financial-aid disbursements
  - '^DEPOP\s+DEPOP'                    # Depop seller payout (ACH, not a purchase)
  # Grailed seller payout only (ACH: strips to exactly this after junk removal).
  # Card PURCHASES strip to 'WWW.GRAILED.COM WWW.GRAILED.C CA' — the $ anchor
  # keeps them out of Income so the GRAILED merchant rule tags them Apparel.
  - '^WWW\.GRAILED\.COM\s+WWW\.GRAILE$'
  # (family-support Zelle pattern lives in categories.local.yaml — it names a
  # real person; see the overlay note at the top of that file)

# 3. Transaction overrides: hand-tags for single rows whose description can
#    never reveal the category (rent paid by Zelle). `date` is the normalised
#    YYYY-MM-DD transaction date; `amount` is matched on absolute value, so
#    it works regardless of source sign convention. A matching row takes the
#    given category directly, skipping peer default_category and merchant
#    rules; peer rows keep their merchant/counterparty and still appear in
#    zelle_review.csv.
#    All current entries are real transaction details of personal payments,
#    so they live in categories.local.yaml (untracked), merged at load.
transaction_overrides: []

# 4. Peer payments (Zelle / QuickPay / Venmo / Apple Cash / Wise).
#    These ARE spending (reimbursements for real consumption). Direction from
#    the Chase Type + sign; every peer row is also written to zelle_review.csv.
peer:
  chase_types_outgoing: [QUICKPAY_DEBIT, CHASE_TO_PARTNERFI]
  chase_types_incoming: [QUICKPAY_CREDIT, PARTNERFI_TO_CHASE]
  description_patterns:                 # card/ACH rails that are really P2P
    - '^VENMO\b'
    - '^WISE US INC'
    - '^APPLE CASH'
  default_category: Miscellaneous       # description almost never says what was bought
  overrides:                            # hand-tagged peer counterparties -> true category
    # (person-name overrides live in categories.local.yaml, appended after these)
    - match: 'EASTERN BAKERY'
      category: Food

# 5. Merchant rules. First match wins. `merchant` is the canonical name used
#    for dedupe and the collapse report; `category` must be a BLS category,
#    or Uncategorized for identifiable-but-unknowable merchants.
merchants:
  # --- fees / cash ---
  - {match: 'FOREIGN EXCHANGE RATE ADJUSTMENT FEE', merchant: CHASE FX FEE, category: Miscellaneous}
  - {match: 'NON-CHASE ATM FEE', merchant: ATM FEE, category: Miscellaneous}
  - {match: '(^|NON-CHASE )ATM WITHDRAW', merchant: ATM WITHDRAWAL, category: Uncategorized}  # cash spend, unattributable

  # --- housing: rent, utilities, lodging, phone/internet, postage ---
