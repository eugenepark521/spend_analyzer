  - {match: 'ARLINGTON FARM', merchant: ARLINGTON FARM (YARDI), category: Housing}
  - {match: 'TOGGLE HOTEL', merchant: TOGGLE HOTEL, category: Housing}       # BLS: other lodging
  - {match: 'TRANSATEL|UBIGI', merchant: UBIGI ESIM, category: Housing}      # BLS: telephone services
  - {match: '^USPS\b', merchant: USPS, category: Housing}                    # BLS: postage & stationery
  - {match: 'FEDEX', merchant: FEDEX, category: Housing}                     # BLS: postage & stationery

